[env:lilygo-t3-s3]
platform = espressif32@6.13.0
board = lilygo-t3-s3
framework = arduino
lib_deps = 
	jgromes/RadioLib@^7.7.1
	SD
	FS
	WiFi
	olikraus/U8g2
build_flags = 
	-I./lib
	-DT3_S3_V1_2_SX1280

